material_database: materials_example.yaml

simulation:
  name: DEM multi-material example
  physics: dem
  time: {start: 0.0, stop: 1.0, output_step: 0.1, dt: 1.0e-6}  # seconds

dem:
  damping_model: restitution

domain:
  box_min: [-1.0, -1.0, -1.0]
  box_max: [1.0, 1.0, 1.0]

walls:
  - id: 1
    type: plain
    material_id: 0
    position: [0.0, 0.0, -1.0]
    normal: [0.0, 0.0, 1.0]

neighbor:
  method: lbvh

io:
  input:
    particle_file: data/dem_particles_v3.bin
  output:
    directory: output/dem_example

gpu: {device_id: 0, block_size: 256}

# Self-gravity and prescribed frame/ephemeris accelerations default to disabled.
# For DEM gravity, enable self_gravity below: FMM, RESPA=2, projection and
# adaptive depth then use their production defaults.
# accelerations:
#   self_gravity: {enabled: true}
